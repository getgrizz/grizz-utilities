# ── Attio ────────────────────────────────────────────────────────────────────
# Run `python run.py setup --crm attio` to create these attributes.  The slugs
# below are the grizz_* attributes Grizz uses — rename any to match what you
# already built and setup will see it exists.
# Notes on Attio's design (handled for you):
#   * `domain_field` is the native `domains` attribute (the unique dedup key);
#     it is written only when creating a new record, not on update.
#   * there is no Grizz domain or company-description attribute on Attio.
#   * Attribute TYPES are config-driven via an optional `field_types:` block
#     (e.g. `field_types: { grizz_phone: phone-number }`) — nothing is hardcoded;
#     phone-number slugs get built-in cleansing and are E.164-normalized on write.

attio:
  domain_field: domains

  # field_types:                 # optional — declare non-text Attio types here
  #   grizz_phone: phone-number

  field_mapping:

    # ── Company Identity ───────────────────────────────────────────────────────
    grizz_id:              grizz_company_id
    gid_company:           grizz_gid
    grizz_url:             grizz_url
    company_name:          grizz_company_name
    linkedin_url:          grizz_linkedin_url

    # ── Contact & Location ─────────────────────────────────────────────────────
    phone:                 grizz_phone
    email:                 grizz_email
    # Attio location attributes are OBJECT-TYPED — one attribute holds
    # city + region + country. Map the three source fields to sub-fields of a
    # single location attribute (dotted slug) and the tool collapses them into
    # one Attio location value on write. Point them at the native
    # `primary_location` instead to populate Attio's built-in location attribute.
    city:                  grizz_location.locality
    state_province_region: grizz_location.region
    country:               grizz_location.country_code

    # ── Firmographics ──────────────────────────────────────────────────────────
    employee_range:        grizz_employee_range
    revenue_range:         grizz_revenue_range
    naics_code:            grizz_naics
    grizz_activity:        grizz_activity_classification

    # ── ERP Intelligence ───────────────────────────────────────────────────────
    erp_tech_stack:        grizz_erp_software
    erp_match_type:        grizz_erp_match_type
    erp_keyword_usage:     grizz_erp_keyword_usage

    # ── ATS Intelligence ───────────────────────────────────────────────────────
    ats_tech_stack:        grizz_ats_software
    ats_match_type:        grizz_ats_match_type
    ats_keyword_usage:     grizz_ats_keyword_usage

    # ── Other Technology Signals ───────────────────────────────────────────────
    other_tech_signals:    grizz_other_tech_signals


# ── Attio — People (contacts) ─────────────────────────────────────────────────
# Used by `python run.py people sync --crm attio` — the client-side contact sync
# (Attio is headless; there is no server-side contact endpoint).  Run
# `python run.py setup --crm attio --object contacts` to create the grizz_contact_*
# attributes below (setup reads THIS section, so it only creates what you map —
# it never touches your Companies object).
#
# Grizz writes ONLY to the grizz_* attributes below on an existing contact — it
# never overwrites native fields on a record it didn't create. The `*_field`
# natives (personal-name, the unique email dedup key, the phone list, the
# Companies reference) are populated ONLY when CREATING a brand-new person, and
# on every write email/phone/etc. also land on their grizz_contact_* attributes.
# `gid` is the dedup id (matched before native email); city/state/country collapse
# into one object-typed location attribute exactly like companies do.

attio_contacts:
  name_field:    name              # native personal-name (seeded on create only)
  email_field:   email_addresses   # native unique attribute — dedup key; seeded on create only
  phone_field:   phone_numbers     # native (seeded on create only)
  company_ref:   company           # native Companies reference — parent link, set on create only
  # last_sync_field: grizz_contact_last_sync   # optional; stamped only with GRIZZ_STAMP_LAST_SYNC=1

  # Attio attribute TYPES are config-driven — declare any slug's type here and
  # setup creates it that way (nothing is hardcoded in the package). Phone-number
  # slugs get Attio's built-in cleansing and are E.164-normalized on write.
  # Location is typed automatically by the dotted-slug syntax below; plain slugs
  # default to text; the standard grizz phone slugs are phone-number by default.
  # Only declare field_types for a RENAMED/custom slug — e.g. if you archived a
  # field and must recreate it under a new name (Attio keeps archived slugs
  # reserved, so the old name can't be reused with a different type):
  # field_types:
  #   grizz_contact_direct_phone: phone-number

  field_mapping:
    gid:          grizz_person_id            # dedup id — stamped on write, matched before email
    company_gid:  grizz_contact_company_gid  # parent company's gid_company
    title:        grizz_contact_title
    seniority:    grizz_contact_seniority
    department:   grizz_contact_job_function
    persona:      grizz_contact_persona
    email:        grizz_contact_email        # Grizz's email for the contact (always written)
    phone:        grizz_contact_phone        # phone-number by default (rename + field_types if archived)
    linkedin_url: grizz_contact_linkedin_url
    # location → ONE object-typed attribute (city/state/country collapse)
    city:         grizz_contact_location.locality
    state:        grizz_contact_location.region
    country:      grizz_contact_location.country_code
